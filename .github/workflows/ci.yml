name: AirScribe CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.10, 3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install opencv-python
          pip install pyqt5
          pip install pyautogui
          pip install numpy
          pip install mediapipe
          pip install pywin32 || true

      - name: Test imports
        run: |
          python -c "import cv2"
          python -c "import PyQt5"
          python -c "import mediapipe"
          python -c "import pyautogui"
          python -c "from tracking.hand_tracker import HandTracker"
          python -c "from core.smoothing import Smoother"
          python -c "from control.mouse_controller import MouseController"

      - name: Compile check
        run: python -m compileall .